[package]
name = "codex-gateway"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone package: keep it out of the codex-rs workspace.
[workspace]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
